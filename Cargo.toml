[package]
name = "hath-rs"
version = "0.1.0"
edition = "2024"

[features]
# Keep the platform allocator as the default. Enable this feature in deployment
# builds to evaluate mimalloc under the target workload.
mimalloc = ["dep:mimalloc"]

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio"] }
openssl = "0.10"
tokio-openssl = "0.6"
reqwest = { version = "0.13.2", default-features = false, features = ["native-tls", "socks"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
sha1 = "0.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3.3"
dashmap = "6"
thiserror = "2"
rand = "0.10.1"
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
regex = "1"
futures-util = "0.3"
fs2 = "0.4"
arc-swap = "1.9.1"
uuid = { version = "1", features = ["v7"] }
socket2 = "0.6"
mimalloc = { git = "https://github.com/yukkodesu/mimalloc_rust.git", rev = "4b108a9173a53a167b4d8be20f5146597d83b9c6", optional = true }

[dev-dependencies]
tempfile = "3"
