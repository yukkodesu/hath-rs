[package]
name = "hath-rs"
version = "0.1.2"
edition = "2024"

[features]
# Keep the platform allocator as the default. Enable this feature in deployment
# builds to evaluate mimalloc under the target workload.
mimalloc = ["dep:mimalloc"]

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "socks"] }
p12 = "0.6"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-native-certs = "0.8"
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
x509-parser = { version = "0.18", features = ["verify"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha1 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3.3"
dashmap = "6"
thiserror = "2"
rand = "0.10"
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
regex = "1"
futures-util = "0.3"
fs2 = "0.4"
arc-swap = "1"
uuid = { version = "1", features = ["v7"] }
socket2 = "0.6"
mimalloc = { git = "https://github.com/yukkodesu/mimalloc_rust.git", rev = "8d2745785801c976a92298b7ee4a8c8411c868d7", optional = true }

[dev-dependencies]
tempfile = "3"

[dev-dependencies.hath-rs-pcache-migrate]
path = "crates/pcache-migrate"

[workspace]
members = ["crates/pcache-migrate"]
resolver = "2"
