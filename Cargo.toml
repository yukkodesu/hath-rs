[package]
name = "hath-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
hyper = { version = "1", features = ["full"] }
hyper-rustls = "0.27"
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"
p12-keystore = "0.3.0-rc3"
reqwest = { version = "0.13.2", default-features = false, features = ["rustls", "socks"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
sha1 = "0.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3.3"
dashmap = "6"
thiserror = "2"
rand = "0.10.1"
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
regex = "1"
futures-util = "0.3"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"
