services:
  hath:
    image: ${HATH_IMAGE:-ghcr.io/yukkodesu/hath-rs:latest}
    environment:
      HATH_CLIENT_ID: xxxx
      HATH_CLIENT_KEY: xxxx
      HATH_PORT: 11451
    ports:
      - "11451:11451"
    restart: unless-stopped
    stop_grace_period: 1m
    # Recommended to uncomment the following lines to keep the log file at a reasonable size.
    # logging:
    #   driver: "json-file"
    #   options:
    #     max-size: "50m"
    volumes:
      - "./volumes/cache:/hath/cache"
      - "./volumes/data:/hath/data"
      - "./volumes/download:/hath/download"
      - "./volumes/log:/hath/log"
      - "./volumes/tmp:/hath/tmp"
