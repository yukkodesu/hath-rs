services:
  hath:
    build: .
    environment:
      HATH_CLIENT_ID: xxxx
      HATH_CLIENT_KEY: xxxx
      HATH_PORT: 11451
    ports:
      - "11451:11451"
    restart: unless-stopped
    volumes:
      - "./volumes/cache:/hath/cache"
      - "./volumes/data:/hath/data"
      - "./volumes/download:/hath/download"
      - "./volumes/log:/hath/log"
      - "./volumes/tmp:/hath/tmp"
