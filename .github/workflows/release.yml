name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  IMAGE_NAME: ghcr.io/yukkodesu/hath-rs

jobs:
  binaries:
    name: Linux musl binary (${{ matrix.target }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@cross
      - name: Build release binary
        run: cross build --locked --release --features mimalloc --target "${{ matrix.target }}"
      - name: Package tarball
        env:
          TARGET: ${{ matrix.target }}
        run: |
          archive="hath-rs-${GITHUB_REF_NAME}-${TARGET}"
          mkdir -p "$archive"
          cp "target/$TARGET/release/hath-rs" "$archive/hath-rs"
          cp README.md LICENSE "$archive/"
          tar -czf "$archive.tar.gz" "$archive"
          sha256sum "$archive.tar.gz" > "$archive.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            hath-rs-*.tar.gz
            hath-rs-*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: binaries
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: '*-unknown-linux-musl'
          merge-multiple: true
      - name: Create combined checksums
        working-directory: dist
        run: cat *.sha256 > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS

  container:
    name: Build Alpine container image (${{ matrix.variant }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: rustls
            dockerfile: deploy/Dockerfile
            arch: amd64
            runner: ubuntu-26.04
          - variant: rustls
            dockerfile: deploy/Dockerfile
            arch: arm64
            runner: ubuntu-26.04-arm
          - variant: openssl
            dockerfile: deploy/Dockerfile.openssl
            arch: amd64
            runner: ubuntu-26.04
          - variant: openssl
            dockerfile: deploy/Dockerfile.openssl
            arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: image-digest-${{ matrix.variant }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  container-manifest:
    name: Publish multi-architecture container image (${{ matrix.variant }})
    needs: container
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: rustls
            tag_suffix: ""
          - variant: openssl
            tag_suffix: "-openssl"
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: image-digest-${{ matrix.variant }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TAG_SUFFIX: ${{ matrix.tag_suffix }}
        run: |
          images=()
          for digest in *; do
            images+=("$IMAGE_NAME@sha256:$digest")
          done
          docker buildx imagetools create \
            --tag "$IMAGE_NAME:$RELEASE_TAG$TAG_SUFFIX" \
            --tag "$IMAGE_NAME:latest$TAG_SUFFIX" \
            "${images[@]}"
