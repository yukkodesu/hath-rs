name: Pcache migrator release

on:
  push:
    tags: ["pcache-migrator-v*"]

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@cross
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: cross build --locked --release --target "${{ matrix.target }}" -p hath-rs-pcache-migrate
      - run: tools/pcache-java-exporter/test.sh
      - run: tools/pcache-java-exporter/build.sh
      - name: Package toolkit
        env:
          TARGET: ${{ matrix.target }}
        run: |
          archive="hath-rs-pcache-migrator-${GITHUB_REF_NAME}-$TARGET"
          mkdir -p "$archive"
          cp "target/$TARGET/release/hath-rs-pcache-migrate" "$archive/"
          cp target/pcache-java-exporter/pcache-java-exporter.jar "$archive/"
          cp README.md "$archive/README.md"
          tar -czf "$archive.tar.gz" "$archive"
          sha256sum "$archive.tar.gz" > "$archive.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            hath-rs-pcache-migrator-*.tar.gz
            hath-rs-pcache-migrator-*.tar.gz.sha256

  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cat *.sha256 > SHA256SUMS
        working-directory: dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
